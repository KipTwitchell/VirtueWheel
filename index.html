<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtue Wheel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#233c38;font:17px/1.45 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:clamp(16px,4vw,36px)}header{border-bottom:1px solid #bdb8a9}h1,h2{font-family:Georgia,serif;font-weight:normal;margin:.15em 0}h1{font-size:clamp(36px,7vw,54px)}h2{font-size:26px}svg{display:block;width:min(100%,500px);margin:12px auto;overflow:visible}button{font:inherit;background:#fffdf7;color:inherit;border:1px solid #9baba4;border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}button:hover,button:focus-visible{background:#e6eee7}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}article{border-top:1px solid #bdb8a9;padding-top:12px}p{margin:.4em 0}#face{transition:transform .38s ease;transform-origin:220px 220px}#wheel.covered{touch-action:none;cursor:grab}.segment{transition:opacity .5s}svg text{pointer-events:none}small{display:block;margin-top:24px;color:#54645d}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* Both levels share one projection. Once the tilt ends, only the lower level moves. */
#upper,#lower{transition:transform .70s ease,opacity .35s ease}
#lower{opacity:0;pointer-events:none}
#projection{opacity:0;pointer-events:none;transform-origin:220px 120px}
#wheel.tilt #upper{transform:translateY(49.6px) scaleY(.32)}
#wheel.tilt #lower{animation:dropLevel 1.8s both;pointer-events:auto}
#wheel.tilt #projection{animation:extendGuides 1.8s both}
#wheel.tilt #guide{animation:showGuide .25s 1.8s both}
@keyframes dropLevel{
  0%,40%{transform:translateY(49.6px) scaleY(.32);opacity:0}
  48%{opacity:1}
  100%{transform:translateY(247.6px) scaleY(.32);opacity:1}
}
@keyframes extendGuides{
  0%,40%{transform:scaleY(0);opacity:0}
  48%{opacity:1}
  100%{transform:scaleY(1);opacity:1}
}
@keyframes showGuide{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#upper,#lower{transition:none}}
#viceRing{visibility:hidden;opacity:0;transition:opacity .65s ease}
#wheel.ring #viceRing{visibility:visible;opacity:1}
#viceRing g{cursor:pointer}
#viceRing g:focus-visible path{stroke:#183e36;stroke-width:3}
#wheel.ring #upper{transform:translate(64.9px,64.9px) scale(.705)}
#wheel.ring .segment text{font-size:14px}
@media(prefers-reduced-motion:reduce){#viceRing{transition:none}}
#schemaScene{display:none}#wheel.schema #schemaScene{display:block;animation:showGuide .5s ease both}#wheel.schema #upper{visibility:hidden}@media(prefers-reduced-motion:reduce){#wheel.schema #schemaScene{animation:none}}#actions{align-items:center;gap:8px}#actions .navIcon{display:inline-block;flex:none;width:26px;height:26px;margin:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.navIcon .accent{fill:#83ad96}.navIcon .wash{fill:#bcd7bd;fill-opacity:.45}
#actions details{flex-basis:100%;border:1px solid #c4cec5;border-radius:10px;background:#fffdf7}
#actions summary{min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer;font-weight:600;list-style:none}
#actions summary::-webkit-details-marker{display:none}#actions summary::after{content:'+';margin-left:auto;font-size:20px}
#actions details[open]>summary::after{content:'−'}
#actions details>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:6px;padding:4px 8px 8px}
#actions button:has(.navIcon){display:inline-flex;align-items:center;gap:8px;text-align:left}
#actions summary:focus-visible{outline:2px solid #295d45;outline-offset:2px}
.wordBlock{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:14px 0}.wordBlock li{padding:6px 10px;border-left:4px solid var(--band);background:white;border-radius:3px}.shadeStrip{display:flex;gap:4px;margin:16px 0}.shadeStrip span{flex:1;padding:12px 4px;text-align:center;border-radius:4px}.shadeStrip .current{outline:2px solid #253b31;outline-offset:2px}.shadeStrip span{min-width:0;align-content:center;font-size:clamp(.78rem,3.4vw,1rem);border:1px solid #a9a69e;overflow-wrap:anywhere}
#primaryOpening{display:none}
#wheel.introduction .segment text:nth-of-type(2){display:none}
#wheel.primary-colors #primaryOpening{display:block}
#wheel.primary-colors #sectors,#wheel.primary-colors #hubLabel{display:none}
@media(prefers-reduced-motion:no-preference){
 #wheelStage.launched #wheel{animation:show-opening .12s .24s both}
}
@keyframes show-opening{from{opacity:0}to{opacity:1}}
#wheelStage{position:relative;width:min(100%,500px);margin:12px auto}
#wheelStage #wheel{width:100%;margin:0}
#wheelPoster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fbf8f1;pointer-events:none;transition:opacity .24s ease}
#wheelStage.launched #wheelPoster{opacity:0}
#wheelStage:not(.launched) #wheel{visibility:hidden}
@media(prefers-reduced-motion:reduce){#wheelPoster{transition:none}}
#wheelStage #wheel.beliefClose{overflow:hidden;border-radius:10px;background:#fffdf9}
#actions .tourStart{width:100%;justify-content:center;background:#24453b;color:white;font-weight:600}
#tourCount{font-size:.85rem;color:#456255}
</style>

const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
function shape(type,attrs,parent){const node=document.createElementNS(ns,type);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.append(node);return node}
function point(r,a){const t=a*Math.PI/180;return [220+r*Math.sin(t),220-r*Math.cos(t)]}
function labelAngle(i){const a=i*30;return a>90&&a<270?a-180:a}
function sector(i,r=209){let a=i*30;return 'M220 220 L'+point(r,a-15)+' A'+r+' '+r+' 0 0 1 '+point(r,a+15)+' Z'}
positions.forEach(([a,b,color,ink],i)=>{const g=shape('g',{class:'segment'},$('sectors'));
 shape('path',{d:sector(i),fill:color},g);const [x,y]=point(158,i*30);for(const [j,line] of [a,b].entries())shape('text',{x,y:y-2+j*14,transform:'rotate('+labelAngle(i)+' '+x+' '+y+')','text-anchor':'middle','font-family':'system-ui','font-size':12,fill:ink},g).textContent=line;g.onclick=()=>{if(mode==='shades')chooseShade(i);else if(mode==='words'){wordIndex=i;render()}else if(mode==='vice')selectPair(i);else if(mode==='full'){angle=i;render()}}});
const primaryLabels=[[0,'Red','Love'],[4,'Yellow','Hope'],[8,'Blue','Faith']].map(([i,colorName,virtueName])=>{
 const angle=i*30, [x,y]=point(145,angle);
 const slice=shape('g',{},$('primaryOpening'));
 shape('path',{d:'M220 220 L'+point(209,angle-60)+' A209 209 0 0 1 '+point(209,angle+60)+' Z',fill:positions[i][2]},slice);
 const label=shape('text',{x,y:y+7,'text-anchor':'middle','font-family':'Georgia','font-size':23,fill:positions[i][3]},slice);
 label.textContent=colorName;
 return {label,colorName,virtueName};
});
function playPrimaryOpening(){
 playWhileReading(2700,ms=>{
   $('wheel').classList.toggle('primary-colors',ms<2700);
   for(const entry of primaryLabels){
     const value=ms<1350?entry.colorName:entry.virtueName;
     if(entry.label.textContent!==value)entry.label.textContent=value;
   }
 });
}

function rimPath(dent){
  const vertices=[];
  for(let a=0;a<360;a+=3){
    const distance=Math.min(Math.abs(a-90),360-Math.abs(a-90));
    vertices.push(point(210-dent*Math.exp(-Math.pow(distance/18,2)),a).join(','));
  }
  return 'M'+vertices.join(' L')+' Z';
}

function animateHalvesRecap(){
 const scene=$('schemaScene');scene.replaceChildren();
 const ring=shape('g',{'pointer-events':'none',inert:''},scene);
 drawBeliefRing(ring);
 for(const g of ring.querySelectorAll('[tabindex]'))g.removeAttribute('tabindex');
 const wheel=shape('g',{},scene);
 const halfWheel=$('sectors').cloneNode(true);halfWheel.removeAttribute('id');wheel.append(halfWheel);
 shape('circle',{cx:220,cy:220,r:57,fill:'#fffdf9'},wheel);
 const label=shape('text',{x:220,y:226,'text-anchor':'middle','font-family':'Georgia','font-size':20},wheel);
 const child=patternChoice===0;
 $('heading').textContent=child?'Child-like half':'Mature half';
 $('caption').textContent='';

 const segments=Array.from(halfWheel.children);
 ring.querySelectorAll('g[role="button"]').forEach((g,i)=>g.style.opacity=((i<6)===child)?1:.32);
 function tick(ms){
   const pulse=Math.min(1,ms/700);
   segments.forEach((g,i)=>g.style.opacity=((i<6)===child)?1:1-.78*pulse);
   const progress=Math.max(0,Math.min(1,(ms-2700)/2100));
   const tilt=Math.min(1,progress/.35);
   const settle=Math.max(0,(progress-.55)/.45);
   const scaleY=1-.60*tilt;
   wheel.setAttribute('transform','translate(220 '+(220-105*tilt)+') scale(1 '+scaleY+') translate(-220 -220)');
   wheel.setAttribute('opacity',1-settle);
   const spread=Math.min(1,Math.max(0,(progress-.25)/.35));
   const ringY=220-105*tilt+189*spread-84*settle;
   ring.setAttribute('transform','translate(220 '+ringY+') scale(1 '+(scaleY+.60*settle)+') translate(-220 -220)');
   ring.setAttribute('opacity',spread);

 }
 reflectiveSequence([4800],tick,()=>showPattern('beliefs',patternChoice));
}

   'The child-like half begins with feeling insufficient and ends with feeling broken. Kip and Abby relate these six positions to interpersonal issues described by Harper and Hoopes.':

 $('actions').replaceChildren();$('extra').replaceChildren();$('wheel').classList.toggle('covered',covered);

 [...$('sectors').children].forEach((g,k)=>{let group=k%4===0?1:k%2===0?2:3;g.style.opacity=mode==='intro' && phase && group!==phase?.22:1;g.firstChild.setAttribute('stroke',mode==='full'&&angle!==null&&k===i?'#233c38':'none');g.firstChild.setAttribute('stroke-width',3)});

 $('heading').textContent=angle===null?'Explore the wheel':i===3?'Patience':i===9?'Diligence':positions[i][0];

   action('Tints and shades',()=>enterShades('full'),'Patterns and relationships','cover');action('Halves and quadrants',enterPatterns,'Patterns and relationships','halves');action('Explore Shame Schema',enterSchema,'Wheel layers','agency')}
}
$('flap').onclick=toggle;
function bearing(e){const box=$('wheel').getBoundingClientRect();return Math.atan2(e.clientX-box.left-box.width/2,box.top+box.height/2-e.clientY)*180/Math.PI}
let start=null;

document.onkeydown=e=>{if((mode==='covered'||(mode==='vice'&&ringReady))&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();(mode==='vice'?advancePair:step)(e.key==='ArrowLeft'?-1:1)}};
